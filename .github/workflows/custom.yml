name: Custom build

on:
    push:
        branches:
            - master
            - "Stable*"
        tags:
            - "v*"
        paths-ignore:
            - "docs/**"
    pull_request:
        paths:
            - ".github/workflows/custom.yml"
            - "deploy/android/**"
            - "deploy/linux/**"
            - "src/**"
            - "custom/**"
            - "CMakeLists.txt"
            - "cmake/**"

# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    check-custom:
        runs-on: ubuntu-latest
        outputs:
            has_custom: ${{ steps.check.outputs.has_custom }}
        steps:
            - uses: actions/checkout@v4
              with:
                  sparse-checkout: custom
                  sparse-checkout-cone-mode: false
            - id: check
              run: |
                  if [ -d custom ] && [ -n "$(ls -A custom 2>/dev/null)" ]; then
                      echo "has_custom=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "has_custom=false" >> "$GITHUB_OUTPUT"
                  fi

    build-android:
        needs: check-custom
        if: needs.check-custom.outputs.has_custom == 'true'
        runs-on: ubuntu-latest

        strategy:
            matrix:
                BuildType: [Release]

        defaults:
            run:
                shell: bash

        env:
            ARTIFACT: QGroundControl-Custom.apk
            PACKAGE: QGroundControl-Custom-Android
            QT_VERSION: 6.8.3
            QT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/deploy/android/android_release.keystore
            QT_ANDROID_KEYSTORE_ALIAS: QGCAndroidKeyStore
            QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            QT_ANDROID_ABIS: ${{ matrix.BuildType == 'Release' && 'armeabi-v7a;arm64-v8a' || 'arm64-v8a' }}

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4
              with:
                  submodules: recursive
                  fetch-depth: 1
                  fetch-tags: false

            - name: Get all tags for correct version determination
              working-directory: ${{ github.workspace }}
              run: |
                  git fetch --all --tags -f --depth 1

            - name: Initial Setup
              uses: ./.github/actions/common

            - name: Free Disk Space
              uses: jlumbroso/free-disk-space@main
              with:
                  tool-cache: false
                  android: false
                  large-packages: false

            - name: Install Qt for Android
              uses: ./.github/actions/qt-android
              with:
                  host: linux
                  arch: linux_gcc_64
                  version: ${{ env.QT_VERSION }}
                  abis: ${{ env.QT_ANDROID_ABIS }}
                  cpm-modules: ${{ runner.temp }}/shadow_build_dir/cpm_modules

            - name: Configure
              working-directory: ${{ runner.temp }}/shadow_build_dir
              run:
                  ${{ env.QT_ROOT_DIR }}/bin/qt-cmake -S ${{ github.workspace }} -B . -G Ninja
                  -DCMAKE_BUILD_TYPE=${{ matrix.BuildType }}
                  -DCMAKE_WARN_DEPRECATED=FALSE
                  -DQT_ANDROID_ABIS="${{ env.QT_ANDROID_ABIS }}"
                  -DQT_ANDROID_BUILD_ALL_ABIS=OFF
                  -DQT_HOST_PATH="${{ env.QT_ROOT_DIR }}/../gcc_64"
                  -DQT_ANDROID_SIGN_APK=${{ env.QT_ANDROID_KEYSTORE_STORE_PASS != '' && 'ON' || 'OFF' }}
                  -DQT_DEBUG_FIND_PACKAGE=ON
                  -DQGC_STABLE_BUILD=${{ github.ref_type == 'tag' || contains(github.ref, 'Stable') && 'ON' || 'OFF' }}

            - name: Build
              working-directory: ${{ runner.temp }}/shadow_build_dir
              run: cmake --build . --target all --config ${{ matrix.BuildType }}

            - run: cp ${{ runner.temp }}/shadow_build_dir/android-build/*.apk ${{ runner.temp }}/shadow_build_dir/${{ env.ARTIFACT }}

            - name: Upload Build File
              uses: ./.github/actions/upload
              with:
                  artifact_name: ${{ env.ARTIFACT }}
                  package_name: ${{ env.PACKAGE }}
                  aws_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}

    build-linux:
        needs: check-custom
        if: needs.check-custom.outputs.has_custom == 'true'
        runs-on: ubuntu-22.04

        strategy:
            matrix:
                BuildType: [Release]

        defaults:
            run:
                shell: bash

        env:
            ARTIFACT: QGroundControl-Custom-x86_64.AppImage
            PACKAGE: QGroundControl-Custom-Linux
            QT_VERSION: 6.8.3

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4
              with:
                  submodules: recursive
                  fetch-depth: 1
                  fetch-tags: false

            - name: Get all tags for correct version determination
              working-directory: ${{ github.workspace }}
              run: |
                  git fetch --all --tags -f --depth 1

            - name: Initial Setup
              uses: ./.github/actions/common

            - name: Install Dependencies
              run: |
                  chmod a+x ./tools/setup/install-dependencies-debian.sh
                  sudo ./tools/setup/install-dependencies-debian.sh

            - name: Install Vulkan
              run: |
                  wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
                  sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list http://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
                  sudo apt update
                  sudo apt install vulkan-sdk

            - name: Setup Caching
              uses: ./.github/actions/cache
              with:
                  host: linux
                  target: linux_gcc_64
                  build-type: ${{ matrix.BuildType }}
                  cpm-modules: ${{ runner.temp }}/shadow_build_dir/cpm_modules

            - name: Install Qt for Linux (x64)
              uses: jurplel/install-qt-action@v4
              with:
                  version: ${{ env.QT_VERSION }}
                  host: linux
                  target: desktop
                  arch: linux_gcc_64
                  dir: ${{ runner.temp }}
                  modules: qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors
                  cache: true

            - name: Configure
              working-directory: ${{ runner.temp }}/shadow_build_dir
              run:
                  ${{ env.QT_ROOT_DIR }}/bin/qt-cmake -S ${{ github.workspace }} -B . -G Ninja
                  -DCMAKE_BUILD_TYPE=${{ matrix.BuildType }}
                  -DQGC_STABLE_BUILD=${{ github.ref_type == 'tag' || contains(github.ref, 'Stable') && 'ON' || 'OFF' }}

            - name: Build
              working-directory: ${{ runner.temp }}/shadow_build_dir
              run: cmake --build . --target all --config ${{ matrix.BuildType }}

            - name: Create AppImage
              working-directory: ${{ runner.temp }}/shadow_build_dir
              run: cmake --install . --config ${{ matrix.BuildType }}

            - name: Upload Build File
              uses: ./.github/actions/upload
              with:
                  artifact_name: ${{ env.ARTIFACT }}
                  package_name: ${{ env.PACKAGE }}
                  aws_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
